<!doctype html>
<html lang="ru" data-theme="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Termion — макет интерфейса</title>
<style>
/* ============ Темы ============ */
html[data-theme="graphite"]{color-scheme:dark;
  --bg-app:#131518;--bg-title:#0f1114;--bg-panel:#171a1e;--bg-panel-2:#1d2126;--bg-hover:#22272d;--bg-active:#25313d;--bg-input:#111316;
  --border:#23272d;--border-strong:#333a43;--text:#e3e7eb;--text-dim:#a2abb5;--text-faint:#6b7480;
  --accent:#3fb6a8;--accent-strong:#62d2c4;--accent-soft:rgba(63,182,168,.15);--on-accent:#06201d;
  --ok:#4cc38a;--warn:#e2b55a;--err:#ef6b73;
  --c-green:#7fcf8e;--c-blue:#73a9ff;--c-yellow:#e0b85a;--c-purple:#c792ea;--c-red:#ef8a8a;--c-folder:#d4a656;
  --term-bg:#0e1013;--term-fg:#d6dce2;--term-dim:#6d7782;--t-green:#7fcf8e;--t-blue:#73a9ff;--t-yellow:#e6c07b;--t-red:#ef6b73;--t-cyan:#5fd0c4;--t-magenta:#c792ea;--cursor:#3fb6a8;--sel:rgba(63,182,168,.3);
  --e-bg:#111317;--e-fg:#d6dce2;--e-gutter:#4a535d;--e-kw:#c792ea;--e-str:#9fd39a;--e-com:#626c77;--e-key:#73a9ff;--e-var:#e6c07b;--e-num:#f2a66b;
  --row-h:28px;--radius:7px;--shadow:0 16px 48px rgba(0,0,0,.5);--tab-h:38px;
}
html[data-theme="classic"]{color-scheme:light;
  --bg-app:#d5dbe2;--bg-title:#c9d0d8;--bg-panel:#eef1f4;--bg-panel-2:#e3e8ed;--bg-hover:#dae2ea;--bg-active:#c6daf2;--bg-input:#ffffff;
  --border:#c0c8d1;--border-strong:#a9b4c0;--text:#1b222a;--text-dim:#4d5966;--text-faint:#7b8692;
  --accent:#2b6cd4;--accent-strong:#1f5bb8;--accent-soft:rgba(43,108,212,.13);--on-accent:#ffffff;
  --ok:#2f9e5b;--warn:#b98100;--err:#d03b3b;
  --c-green:#2f9e5b;--c-blue:#2b6cd4;--c-yellow:#b98100;--c-purple:#8e44c9;--c-red:#d03b3b;--c-folder:#e2a11b;
  --term-bg:#1e1e1e;--term-fg:#ececec;--term-dim:#8a9099;--t-green:#6fd16f;--t-blue:#72aaff;--t-yellow:#f0c674;--t-red:#ff6b6b;--t-cyan:#56d4dd;--t-magenta:#d28ef0;--cursor:#b4b4c0;--sel:rgba(114,170,255,.32);
  --e-bg:#ffffff;--e-fg:#1f2328;--e-gutter:#9aa4af;--e-kw:#a626a4;--e-str:#2e7d32;--e-com:#8b949e;--e-key:#1f5bb8;--e-var:#b35900;--e-num:#b35900;
  --row-h:24px;--radius:4px;--shadow:0 10px 30px rgba(20,30,45,.25);--tab-h:32px;
}
html[data-theme="light"]{color-scheme:light;
  --bg-app:#f3f4f7;--bg-title:#eceef2;--bg-panel:#fafbfc;--bg-panel-2:#f0f2f6;--bg-hover:#eceff4;--bg-active:#e4e9fe;--bg-input:#ffffff;
  --border:#e1e5eb;--border-strong:#cfd5de;--text:#1d2330;--text-dim:#5a6374;--text-faint:#939cab;
  --accent:#5b5ce6;--accent-strong:#4748cf;--accent-soft:rgba(91,92,230,.12);--on-accent:#ffffff;
  --ok:#1f9d63;--warn:#b7791f;--err:#d0394a;
  --c-green:#1f9d63;--c-blue:#3461d1;--c-yellow:#b7791f;--c-purple:#8e44c9;--c-red:#d0394a;--c-folder:#e3a23c;
  --term-bg:#ffffff;--term-fg:#262b36;--term-dim:#8b93a1;--t-green:#1f8f52;--t-blue:#3461d1;--t-yellow:#a86b00;--t-red:#d0394a;--t-cyan:#0f8585;--t-magenta:#8e44c9;--cursor:#5b5ce6;--sel:rgba(91,92,230,.2);
  --e-bg:#ffffff;--e-fg:#262b36;--e-gutter:#a7afbb;--e-kw:#8e44c9;--e-str:#1f8f52;--e-com:#98a1ae;--e-key:#3461d1;--e-var:#a86b00;--e-num:#b5532a;
  --row-h:30px;--radius:8px;--shadow:0 16px 40px rgba(30,40,70,.16);--tab-h:40px;
}

/* ============ База ============ */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg-app)}
body{color:var(--text);font:13px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:"Cascadia Mono","Cascadia Code",Consolas,"Courier New",monospace}
.ic{width:16px;height:16px;flex:none;display:block}
kbd{font:10.5px "Cascadia Mono",Consolas,monospace;padding:1px 5px;border-radius:4px;border:1px solid var(--border-strong);color:var(--text-faint);background:var(--bg-panel-2);white-space:nowrap}
::selection{background:var(--sel)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background-color:var(--text-faint)}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}

/* ============ Раскладки ============ */
.app{position:fixed;inset:0;display:grid;background:var(--bg-app);
  --tool-h:0px;--rail-w:0px;--left-w:272px;--right-w:0px;
  grid-template-rows:34px var(--tool-h) minmax(0,1fr) minmax(0,1.15fr) 24px;
  grid-template-columns:var(--rail-w) var(--left-w) minmax(0,1fr) var(--right-w)}
.app[data-layout="stacked"]{grid-template-areas:"title title title title" "tool tool tool tool" ". s main ." ". f main ." "status status status status"}
.app[data-layout="ide"]{--left-w:250px;--right-w:290px;grid-template-areas:"title title title title" "tool tool tool tool" ". s main f" ". s main f" "status status status status"}
.app[data-layout="classic"]{--tool-h:56px;--rail-w:42px;--left-w:270px;grid-template-areas:"title title title title" "tool tool tool tool" "rail s main ." "rail s main ." "status status status status"}
.titlebar{grid-area:title}.toolbar{grid-area:tool}.rail{grid-area:rail}.sessions{grid-area:s}.files{grid-area:f}.workspace{grid-area:main}.status{grid-area:status}
.app[data-layout="classic"] .files{grid-area:s}
.app[data-layout="classic"][data-side="sessions"] .files,.app[data-layout="classic"][data-side="files"] .sessions{display:none}
.app:not([data-layout="classic"]) .toolbar,.app:not([data-layout="classic"]) .rail{display:none}

/* ============ Заголовок окна ============ */
.titlebar{display:flex;align-items:center;gap:12px;padding-left:12px;background:var(--bg-title);border-bottom:1px solid var(--border);user-select:none;min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.brand-name{font-size:13px;letter-spacing:.02em}
.logo{flex:none;display:block}
.search-trigger{display:flex;align-items:center;gap:8px;height:24px;width:min(360px,28vw);padding:0 5px 0 9px;margin-left:22px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-input);color:var(--text-faint);font-size:12px}
.search-trigger span{flex:1;text-align:left}
.search-trigger:hover{border-color:var(--border-strong)}
.mock{margin-left:auto;display:flex;align-items:center;gap:6px;padding:2px 3px 2px 9px;border:1px dashed var(--border-strong);border-radius:8px}
.mock-label{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.seg{display:flex;background:var(--bg-panel-2);border:1px solid var(--border);border-radius:6px;padding:2px;gap:2px}
.seg button{display:flex;align-items:center;gap:6px;border:0;background:none;padding:0 8px;height:20px;border-radius:4px;font-size:11.5px;color:var(--text-dim);white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.winctl{display:flex;height:100%}
.winctl button{width:44px;height:100%;border:0;background:none;color:var(--text-dim);display:grid;place-items:center}
.winctl button:hover{background:var(--bg-hover)}
.winctl .close:hover{background:#e81123;color:#fff}
.winctl .ic{width:14px;height:14px}

/* ============ «Классика»: панель кнопок и полоса слева ============ */
.toolbar{display:flex;align-items:stretch;gap:2px;padding:4px 8px;background:var(--bg-panel-2);border-bottom:1px solid var(--border)}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:76px;padding:0 8px;border:1px solid transparent;border-radius:var(--radius);background:none;font-size:11.5px;color:var(--text)}
.tb .ic{width:20px;height:20px;color:var(--accent)}
.tb:hover,.tb.on{background:var(--bg-hover);border-color:var(--border)}
.tb-sep{width:1px;background:var(--border);margin:6px 4px}
.rail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;background:var(--bg-panel-2);border-right:1px solid var(--border)}
.rail-btn{position:relative;width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:var(--radius);background:none;color:var(--text-dim)}
.rail-btn:hover{background:var(--bg-hover);color:var(--text)}
.rail-btn.on{background:var(--accent-soft);color:var(--accent)}
.rail-btn.on::before{content:"";position:absolute;left:-5px;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--accent)}
.rail-btn .badge{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--bg-panel-2);display:none}
.rail-btn .badge.on{display:block}
.rail .spacer{flex:1}

/* ============ Панели ============ */
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg-panel)}
.app[data-layout="stacked"] .panel{border-right:1px solid var(--border)}
.app[data-layout="stacked"] .files{border-top:1px solid var(--border)}
.app[data-layout="ide"] .sessions{border-right:1px solid var(--border)}
.app[data-layout="ide"] .files{border-left:1px solid var(--border)}
.app[data-layout="classic"] .panel{border-right:1px solid var(--border)}
.panel-head{display:flex;align-items:center;gap:7px;height:36px;padding:0 6px 0 12px;flex:none;min-width:0}
.ph-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);white-space:nowrap}
.panel.focused .ph-title{color:var(--text-dim)}
.ph-count{font-size:11px;color:var(--text-faint)}
.ph-chip{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:600;min-width:0;overflow:hidden;white-space:nowrap}
.ph-chip span{overflow:hidden;text-overflow:ellipsis}
.ph-chip i{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.ph-chip.off{background:var(--bg-panel-2);color:var(--text-faint)}
.ph-chip.off i{background:var(--text-faint)}
.ph-actions{margin-left:auto;display:flex;gap:1px;flex:none}
.icon-btn{width:26px;height:26px;display:grid;place-items:center;border:0;border-radius:calc(var(--radius) - 1px);background:none;color:var(--text-dim);flex:none}
.icon-btn:hover{background:var(--bg-hover);color:var(--text)}
.icon-btn.on{color:var(--accent);background:var(--accent-soft)}
.search{display:flex;align-items:center;gap:7px;margin:0 8px 6px;padding:0 8px;height:28px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-input);color:var(--text-faint);flex:none;cursor:text}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--text);font-size:12.5px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tree{flex:1;overflow:auto;padding:2px 6px 12px;min-height:0}
.row{position:relative;display:flex;align-items:center;gap:6px;height:var(--row-h);padding:0 8px 0 calc(4px + var(--d,0) * 16px);border-radius:calc(var(--radius) - 1px);white-space:nowrap;color:var(--text);user-select:none;cursor:default}
.row:hover{background:var(--bg-hover)}
.row.selected{background:var(--bg-active)}
.row .chev{width:14px;height:14px;color:var(--text-faint);flex:none;transition:transform .12s}
.row .chev .ic{width:14px;height:14px}
.row.open>.chev{transform:rotate(90deg)}
.row .ri{position:relative;display:grid;place-items:center;color:var(--text-dim);flex:none}
.row .ri.live{color:var(--accent)}
.row .rn{overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .cnt,.row .meta{margin-left:auto;padding-left:10px;font-size:11px;color:var(--text-faint);flex:none}
.row.sess .meta,.row.ffile .meta{opacity:0;transition:opacity .12s}
.row.sess:hover .meta,.row.sess.selected .meta,.row.ffile:hover .meta{opacity:1}
.row.opened .rn{color:var(--accent);font-weight:600}
.sdot{position:absolute;right:-3px;bottom:-2px;width:7px;height:7px;border-radius:50%;box-shadow:0 0 0 2px var(--bg-panel);display:none}
.sdot.on{display:block;background:var(--ok)}
.row:hover .sdot{box-shadow:0 0 0 2px var(--bg-hover)}
.row.selected .sdot{box-shadow:0 0 0 2px var(--bg-active)}
.fi-folder{color:var(--c-folder)!important}
.fi-sh,.fi-nginx{color:var(--c-green)!important}.fi-py,.fi-md{color:var(--c-blue)!important}.fi-yaml,.fi-css{color:var(--c-purple)!important}
.fi-env{color:var(--c-yellow)!important}.fi-html{color:var(--c-red)!important}.fi-log,.fi-bin{color:var(--text-faint)!important}.fi-txt{color:var(--text-dim)!important}
mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 1px}
.inline-input{flex:1;min-width:0;height:calc(var(--row-h) - 6px);border:1px solid var(--accent);border-radius:4px;background:var(--bg-input);outline:none;padding:0 6px;font-size:12.5px;box-shadow:0 0 0 3px var(--accent-soft)}
.pathbar{display:flex;align-items:center;gap:3px;padding:0 6px 6px 8px;flex:none}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;overflow:hidden;height:26px;padding:0 6px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-input);font-size:12px;white-space:nowrap}
.crumb{border:0;background:none;padding:0 2px;color:var(--text-dim);border-radius:3px}
.crumb:hover{color:var(--accent)}
.crumb.last{color:var(--text);font-weight:600}
.crumbs .sep{color:var(--text-faint);padding:0 1px}
.empty-panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;color:var(--text-faint);font-size:12.5px}
.empty-panel .ic{width:28px;height:28px}
.empty-panel p{margin:0;max-width:200px}
.empty-small{padding:18px 10px;color:var(--text-faint);text-align:center;font-size:12px}

/* ============ Вкладки ============ */
.workspace{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg-app)}
.tabs{display:flex;align-items:flex-end;gap:2px;height:var(--tab-h);padding:0 8px 0 6px;background:var(--bg-panel-2);border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden;flex:none}
.tabs::-webkit-scrollbar{height:0}
.tab{position:relative;display:flex;align-items:center;gap:7px;height:calc(var(--tab-h) - 6px);padding:0 5px 0 11px;border:1px solid transparent;border-bottom:0;border-radius:var(--radius) var(--radius) 0 0;color:var(--text-dim);white-space:nowrap;max-width:240px;user-select:none;cursor:default;flex:none}
.tab:hover{background:var(--bg-hover);color:var(--text)}
.tab.active{height:calc(var(--tab-h) - 5px);margin-bottom:-1px;border-color:var(--border)}
.tab.active.is-term{background:var(--term-bg);color:var(--term-fg)}
.tab.active.is-file{background:var(--e-bg);color:var(--e-fg)}
.tab.active::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:2px;background:var(--accent);border-radius:2px 2px 0 0}
.tab-ic{position:relative;display:grid;place-items:center}
.tab-ic i{position:absolute;right:-3px;bottom:-2px;width:7px;height:7px;border-radius:50%;background:var(--text-faint);box-shadow:0 0 0 2px var(--bg-panel-2)}
.tab-ic i.ok{background:var(--ok)}
.tab.active.is-term .tab-ic i{box-shadow:0 0 0 2px var(--term-bg)}
.tab-name{overflow:hidden;text-overflow:ellipsis}
.tab-sub{font-size:11px;opacity:.55}
.tab-x{width:20px;height:20px;display:grid;place-items:center;border:0;border-radius:4px;background:none;color:inherit;opacity:0}
.tab:hover .tab-x,.tab.active .tab-x{opacity:.6}
.tab-x:hover{opacity:1!important;background:rgba(127,127,127,.22)}
.tab-x .ic{width:12px;height:12px}
.tab-dirty{width:20px;height:20px;display:grid;place-items:center;color:var(--accent);font-size:15px;line-height:1;border-radius:4px}
.tab-dirty:hover{background:rgba(127,127,127,.22)}
.tab-add{align-self:center;width:26px;height:26px;display:grid;place-items:center;border:0;border-radius:var(--radius);background:none;color:var(--text-faint);margin-left:2px;flex:none}
.tab-add:hover{background:var(--bg-hover);color:var(--text)}

/* ============ Терминал ============ */
.pane{position:relative;flex:1;min-height:0;background:var(--term-bg)}
.term{position:absolute;inset:0;overflow:auto;padding:12px 16px 18px;color:var(--term-fg);font:13.5px/1.5 "Cascadia Mono","Cascadia Code",Consolas,monospace;white-space:pre-wrap;word-break:break-word;cursor:text}
.term .ln{min-height:1.5em}
.cur{display:inline-block;width:.6em;height:1.2em;vertical-align:-.22em;background:var(--cursor);animation:blink 1.1s steps(1) infinite}
.term.blur .cur{background:transparent;box-shadow:inset 0 0 0 1px var(--cursor);animation:none}
@keyframes blink{50%{opacity:0}}
.t-green{color:var(--t-green)}.t-blue{color:var(--t-blue)}.t-yellow{color:var(--t-yellow)}.t-red{color:var(--t-red)}.t-cyan{color:var(--t-cyan)}.t-magenta{color:var(--t-magenta)}
.b{font-weight:700}.dim{color:var(--term-dim)}

/* ============ Редактор ============ */
.editor{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--e-bg)}
.ed-bar{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px 0 14px;border-bottom:1px solid var(--border);background:var(--bg-panel);flex:none;min-width:0}
.ed-path{display:flex;align-items:center;gap:8px;min-width:0;color:var(--text);font-size:12.5px}
.ed-path .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-on{color:var(--text-faint);white-space:nowrap}
.ed-actions{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.ed-lang{font-size:11.5px;color:var(--text-faint);padding:0 6px}
.ed-body{flex:1;overflow:auto;display:flex;align-items:flex-start;font:13px/1.6 "Cascadia Mono","Cascadia Code",Consolas,monospace}
.gutter{flex:none;position:sticky;left:0;padding:12px 12px 60px 14px;min-width:50px;text-align:right;white-space:pre;color:var(--e-gutter);background:var(--e-bg);user-select:none}
.code{flex:1;margin:0;padding:12px 24px 60px 8px;outline:none;color:var(--e-fg);white-space:pre;tab-size:4;caret-color:var(--accent);min-height:100%;font:inherit}
.k{color:var(--e-kw)}.s{color:var(--e-str)}.c{color:var(--e-com);font-style:italic}.y{color:var(--e-key)}.v{color:var(--e-var)}.n{color:var(--e-num)}.h{color:var(--e-key);font-weight:700}
.lg-err{color:var(--err)}.lg-warn{color:var(--warn)}.lg-info{color:var(--e-key)}

/* ============ Пустая область ============ */
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--bg-app);color:var(--text-dim);text-align:center;padding:20px}
.empty h2{margin:4px 0 0;font-size:20px;color:var(--text);font-weight:600;letter-spacing:.01em}
.empty p{margin:0}
.empty-actions{display:flex;gap:8px;margin-top:6px}
.empty-keys{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--text-faint)}

/* ============ Кнопки ============ */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--bg-panel);color:var(--text);font-size:12.5px;white-space:nowrap}
.btn:hover{background:var(--bg-hover)}
.btn .ic{width:14px;height:14px}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff}

.chip>.ic{width:11px;height:11px;color:var(--accent)}

.chip .scope .ic{width:11px;height:11px}
.chip.running{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chip[data-off]{opacity:.5}
.chip-add{border-style:dashed;background:none;color:var(--text-dim)}

.st-warn{color:var(--warn)}
.st-right{margin-left:auto;display:flex;gap:14px}

function activate(id) {

function closeTab(id) {

async function typeCommands(sid, commands, enter = true) {
  const t = state.terms[sid];

  t.busy = true;
  try {
    for (const line of commands) {
      t.input = '';
      for (const ch of line) { t.input += ch; if (activeSid() === sid) renderPane(); await sleep(line.length > 30 ? 9 : 16); }

function renderSessions() {
  $('#sessCount').textContent = countSessions(SESSIONS);
  const f = state.filter.trim().toLowerCase();
  const match = n => (n.name + ' ' + n.host + ' ' + n.user).toLowerCase().includes(f);
  const folderHas = n => n.children.some(c => c.type === 'folder' ? folderHas(c) : match(c));
  const mark = name => {
    const i = f ? name.toLowerCase().indexOf(f) : -1;
    if (i < 0) return esc(name);
    return esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + f.length)) + '</mark>' + esc(name.slice(i + f.length));
  };
  const rows = [];
  const walkRows = (nodes, d) => {
    for (const n of nodes) {
      if (n.type === 'folder') {
        if (f && !folderHas(n)) continue;
        const open = f ? true : n.open;
        rows.push(`<div class="row folder${open ? ' open' : ''}${state.selectedSession === n.id ? ' selected' : ''}" data-folder="${n.id}" style="--d:${d}"><span class="chev">${ic('chev')}</span><span class="ri fi-folder">${ic('folder')}</span><span class="rn">${esc(n.name)}</span><span class="cnt">${countSessions(n.children)}</span></div>`);
        if (open) walkRows(n.children, d + 1);

        if (f && !match(n)) continue;
        const on = isConnected(n.id);
        rows.push(`<div class="row sess${state.selectedSession === n.id ? ' selected' : ''}" data-sess="${n.id}" style="--d:${d}" title="${attr(n.user + '@' + n.host + ':' + n.port + ' — двойной клик, чтобы подключиться')}"><span class="chev"></span><span class="ri${on ? ' live' : ''}">${ic('server')}<i class="sdot${on ? ' on' : ''}"></i></span><span class="rn">${mark(n.name)}</span><span class="meta mono">${esc(n.host)}</span></div>`);

function openModal({ title, icon, body, buttons, onMount, width }) {
  closeModal();

  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal" role="dialog"${width ? ` style="width:min(${width}px,calc(100vw - 32px))"` : ''}>
    <div class="modal-head">${icon ? `<span class="mh-ic">${ic(icon)}</span>` : ''}<h3>${esc(title)}</h3><button class="icon-btn" data-m="close" title="Закрыть">${ic('x')}</button></div>

  document.body.appendChild(ov);
  state.modal = ov;
  ov.addEventListener('mousedown', e => { if (e.target === ov) closeModal(ov); });
  ov.addEventListener('click', e => {
    if (e.target.closest('[data-m="close"]')) { closeModal(ov); return; }
    const b = e.target.closest('[data-mb]');
    if (!b) return;
    const def = buttons[+b.dataset.mb];
    if (!def.run || def.run(ov) !== false) closeModal(ov);
  });
  ov.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
      const i = buttons.findIndex(b => b.primary);
      if (i >= 0) { e.preventDefault(); ov.querySelector(`[data-mb="${i}"]`).click(); }
    }
  });
  if (onMount) onMount(ov);
  const first = ov.querySelector('.modal-body input, .modal-body textarea');
  if (first) setTimeout(() => first.focus(), 30);
}
function closeModal(ov) {
  const target = ov || state.modal;
  if (!target) return;
  target.remove();
  if (state.modal === target) state.modal = null;

function startCreateHere(mode) {

  let parent = fv.root;

function commitEdit(value) {
  const ed = state.editing;
  if (!ed) return;
  state.editing = null;
  const name = value.trim();
  const fs = state.fs[ed.sid];
  if (!name) { renderFiles(); return; }
  if (name.includes('/')) { toast('Имя не может содержать «/»', 'info'); renderFiles(); return; }
  if (ed.mode === 'rename') {
    const node = getNode(fs, ed.path), par = getNode(fs, parentPath(ed.path));
    if (name === node.name) { renderFiles(); return; }
    if (par.children.some(c => c.name === name)) { toast('Такое имя уже есть', 'info'); renderFiles(); return; }
    const newPath = joinPath(parentPath(ed.path), name);
    node.name = name;
    state.tabs.forEach(t => { if (t.kind === 'file' && t.sid === ed.sid && (t.path === ed.path || t.path.startsWith(ed.path + '/'))) t.path = newPath + t.path.slice(ed.path.length); });
    const fv = state.files[ed.sid];
    fv.expanded = new Set(Array.from(fv.expanded).map(p => p === ed.path || p.startsWith(ed.path + '/') ? newPath + p.slice(ed.path.length) : p));
    fv.sel = newPath;
    state.paneKey = '';
    renderAll();
    toast('Переименовано: ' + name);
    return;
  }
  const par = getNode(fs, ed.parent);
  if (par.children.some(c => c.name === name)) { toast('Такое имя уже есть', 'info'); renderFiles(); return; }
  par.children.push(ed.mode === 'newdir' ? D(name) : F(name, ''));
  const p = joinPath(ed.parent, name);
  state.files[ed.sid].sel = p;
  if (ed.mode === 'newfile') { openFile(ed.sid, p); toast('Файл создан: ' + p); }
  else { renderFiles(); toast('Папка создана: ' + p); }
}

function handleFilesKey(e) {
  const sid = activeSid();
  if (!sid || !isConnected(sid)) return;
  const fv = state.files[sid];
  if (!fv.sel) return;
  const n = getNode(state.fs[sid], fv.sel);
  if (!n) return;
  if (e.key === 'F2') { e.preventDefault(); state.editing = { sid, mode: 'rename', path: fv.sel }; renderFiles(); }

  }

    const r = e.target.closest('.row.sess'), f = e.target.closest('.row.folder');
    if (r) { state.selectedSession = r.dataset.sess; renderSessions(); sessionMenu(e.clientX, e.clientY, r.dataset.sess); }
    else if (f) { state.selectedSession = f.dataset.folder; renderSessions(); folderMenu(e.clientX, e.clientY, f.dataset.folder); }
    else showMenu(e.clientX, e.clientY, [{ label: 'Новая сессия', icon: 'plus', run: () => openSessionModal(null, '') }, { label: 'Новая папка', icon: 'folderPlus', run: () => openFolderModal(null, '') }]);
  });
  sp.addEventListener('input', e => { if (e.target.id === 'sessFilter') { state.filter = e.target.value; renderSessions(); } });

  const fp = $('#filesPanel');
  fp.addEventListener('mousedown', () => setFocus('files'));
  fp.addEventListener('click', e => {
    if (e.target.closest('[data-act]') || e.target.closest('.inline')) return;
    const row = e.target.closest('.row[data-path]');
    if (!row) return;
    const fv = state.files[activeSid()], p = row.dataset.path;
    fv.sel = p;
    if (row.dataset.kind === 'dir') { if (fv.expanded.has(p)) fv.expanded.delete(p); else fv.expanded.add(p); }
    renderFiles();
  });
  fp.addEventListener('dblclick', e => { const row = e.target.closest('.row[data-kind="file"]'); if (row) openFile(activeSid(), row.dataset.path); });
  fp.addEventListener('contextmenu', e => {
    if (e.target.closest('input')) return;
    e.preventDefault();
    const row = e.target.closest('.row[data-path]');
    fileMenu(e.clientX, e.clientY, row ? row.dataset.path : null);
  });
  fp.addEventListener('keydown', e => {
    if (e.target.id !== 'inlineEdit') return;
    if (e.key === 'Enter') { e.preventDefault(); commitEdit(e.target.value); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); state.editing = null; renderFiles(); }
  });
  fp.addEventListener('focusout', e => {
    if (e.target.id !== 'inlineEdit') return;
    setTimeout(() => { if (state.editing && document.activeElement && document.activeElement.id !== 'inlineEdit') { state.editing = null; renderFiles(); } }, 150);
  });

  const tabs = $('#tabs');
  tabs.addEventListener('click', e => {
    const x = e.target.closest('[data-close]');
    if (x) { closeTab(x.dataset.close); return; }
    const tb = e.target.closest('.tab');
    if (tb) activate(tb.dataset.tab);
  });
  tabs.addEventListener('auxclick', e => { if (e.button === 1) { const tb = e.target.closest('.tab'); if (tb) closeTab(tb.dataset.tab); } });

  const pane = $('#pane');
  pane.addEventListener('mousedown', () => setFocus('pane'));
  pane.addEventListener('input', e => { const code = e.target.closest && e.target.closest('.code'); if (code) onEditorInput(code); });

  const mac = $('#macros');
  mac.addEventListener('click', e => {
    const c = e.target.closest('[data-macro]');
    if (!c) return;
    if (c.dataset.off) { toast('Сначала подключитесь к сессии', 'info'); return; }
    runMacro(c.dataset.macro);
  });
  mac.addEventListener('contextmenu', e => {
    const c = e.target.closest('[data-macro]');
    if (!c) return;
    e.preventDefault();
    const id = c.dataset.macro, m = state.macros.find(x => x.id === id);
    showMenu(e.clientX, e.clientY, [
      { label: 'Запустить', icon: 'play', kbd: m.hotkey || '', run: () => runMacro(id) },
      { label: 'Изменить…', icon: 'edit', run: () => openMacroModal(id) },
      { label: 'Дублировать', icon: 'copy', run: () => { state.macros.push(Object.assign({}, m, { id: nid('m'), name: m.name + ' (копия)', hotkey: '' })); renderMacros(); } },
      { sep: true },
      { label: 'Удалить', icon: 'trash', danger: true, run: () => { state.macros = state.macros.filter(x => x.id !== id); renderMacros(); toast('Макрос удалён'); } }
    ]);
  });

  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'Escape') {
      if (state.modal) { closeModal(); return; }
      if (menuEl) { hideMenu(); return; }
    }
    if (state.modal) return;
    const mod = e.ctrlKey || e.metaKey;
    if (e.ctrlKey && e.altKey) {
      const hk = hotkeyOf(e).toLowerCase();
      const m = state.macros.find(x => x.hotkey && x.hotkey.toLowerCase() === hk);
      if (m) { e.preventDefault(); runMacro(m.id); return; }
    }
    if (mod && k.toLowerCase() === 's') { e.preventDefault(); saveActive(); return; }
    if (mod && k.toLowerCase() === 'k') { e.preventDefault(); focusSearch(); return; }
    const inField = e.target.closest && e.target.closest('input, textarea, select, [contenteditable]');
    if (inField) {
      if (k === 'Tab' && e.target.closest('.code')) { e.preventDefault(); document.execCommand('insertText', false, '    '); }
      return;
    }
    if (e.target.closest && e.target.closest('button') && (k === 'Enter' || k === ' ')) return;
    if (state.focusArea === 'files') { handleFilesKey(e); return; }
    if (state.focusArea === 'sessions') {
      if (k === 'Enter' && state.selectedSession) { e.preventDefault(); openSession(state.selectedSession); }
      return;
    }
    const tab = activeTabObj();
    if (!tab || tab.kind !== 'term') return;
    const t = state.terms[tab.sid];
    if (!t) return;
    if (t.closed) { if (k === 'Enter') { e.preventDefault(); reconnect(tab.sid); } return; }
    if (t.busy) { e.preventDefault(); return; }
    if (mod && k.toLowerCase() === 'l') { e.preventDefault(); t.lines = []; renderPane(); return; }
    if (mod && k.toLowerCase() === 'c') {
      if (String(window.getSelection())) return;
      e.preventDefault(); out(t, promptHTML(tab.sid) + esc(t.input) + '^C'); t.input = ''; renderPane(); return;
    }
    if (mod || e.altKey) return;
    if (k === 'Enter') { e.preventDefault(); execInput(tab.sid); }
    else if (k === 'Backspace') { e.preventDefault(); t.input = t.input.slice(0, -1); renderPane(); }
    else if (k === 'ArrowUp') {
      e.preventDefault();
      if (!t.hist.length) return;
      t.hi = t.hi < 0 ? t.hist.length - 1 : Math.max(0, t.hi - 1);
      t.input = t.hist[t.hi]; renderPane();
    } else if (k === 'ArrowDown') {
      e.preventDefault();
      if (t.hi < 0) return;
      t.hi++;
      if (t.hi >= t.hist.length) { t.hi = -1; t.input = ''; } else t.input = t.hist[t.hi];
      renderPane();
    } else if (k === 'Tab') { e.preventDefault(); complete(tab.sid); }
    else if (k.length === 1) { e.preventDefault(); t.input += k; t.hi = -1; renderPane(); }
  });
  document.addEventListener('paste', e => {
    if (state.modal || (e.target.closest && e.target.closest('input, textarea, [contenteditable]'))) return;
    const tab = activeTabObj();
    if (!tab || tab.kind !== 'term' || state.focusArea !== 'pane') return;
    const t = state.terms[tab.sid];
    if (!t || t.closed || t.busy) return;
    const text = (e.clipboardData || window.clipboardData).getData('text');
    if (!text) return;
    e.preventDefault();
    t.input += text.replace(/\r?\n/g, ' ');
    renderPane();
  });
}

/* ================= Каркас и запуск ================= */
function buildChrome() {
  $('#titlebar').innerHTML = `
    <div class="brand">${logo(18)}<span class="brand-name">Termion</span></div>
    <button class="search-trigger" data-act="search">${ic('search')}<span>Поиск сессий…</span><kbd>Ctrl K</kbd></button>
    <div class="mock" title="Переключатель вариантов макета — в программе его не будет">
      <span class="mock-label">Макет</span>
      <div class="seg">${[['graphite', 'Графит'], ['classic', 'Классика'], ['light', 'Светлая']].map(([v, l]) => `<button data-act="theme" data-v="${v}">${l}</button>`).join('')}</div>
      <div class="seg">${[['stacked', 'Слева стопкой'], ['classic', 'Как в MobaXterm'], ['ide', 'Файлы справа']].map(([v, l]) => `<button data-act="layout" data-v="${v}">${l}</button>`).join('')}</div>
    </div>
    <div class="winctl"><button data-act="toast" data-msg="Свернуть окно" title="Свернуть">${ic('min')}</button><button data-act="toast" data-msg="Развернуть окно" title="Развернуть">${ic('max')}</button><button class="close" data-act="toast" data-msg="Закрыть Termion" title="Закрыть">${ic('x')}</button></div>`;
  $('#toolbar').innerHTML = `
    <button class="tb" data-act="new-session">${ic('plus')}<span>Сессия</span></button>
    <button class="tb" data-act="connect-selected">${ic('plug')}<span>Подключить</span></button>
    <div class="tb-sep"></div>
    <button class="tb" data-act="side" data-v="files">${ic('folder')}<span>Файлы</span></button>
    <button class="tb" data-act="new-macro">${ic('bolt')}<span>Макрос</span></button>
    <button class="tb" data-act="split">${ic('split')}<span>Разделить</span></button>
    <div class="tb-sep"></div>
    <button class="tb" data-act="settings">${ic('gear')}<span>Настройки</span></button>`;
  $('#rail').innerHTML = `
    <button class="rail-btn" data-act="side" data-v="sessions" title="Сессии">${ic('server')}</button>
    <button class="rail-btn" data-act="side" data-v="files" title="Файлы на сервере">${ic('folder')}<i class="badge" id="railBadge"></i></button>
    <div class="spacer"></div>
    <button class="rail-btn" data-act="settings" title="Настройки">${ic('gear')}</button>`;
  $('#sessionsPanel').innerHTML = `
    <div class="panel-head"><span class="ph-title">Сессии</span><span class="ph-count" id="sessCount"></span>
      <div class="ph-actions">
        <button class="icon-btn" data-act="new-session" title="Новая сессия">${ic('plus')}</button>
        <button class="icon-btn" data-act="new-folder" title="Новая папка">${ic('folderPlus')}</button>
        <button class="icon-btn" data-act="collapse" title="Свернуть все папки">${ic('collapse')}</button>
      </div></div>
    <label class="search">${ic('search')}<input id="sessFilter" placeholder="Поиск сессий…" autocomplete="off" spellcheck="false"></label>
    <div class="tree" id="sessTree"></div>`;
}
function showHint() {
  try { if (sessionStorage.getItem('termion-hint')) return; } catch (_) { /* ничего */ }
  const h = document.createElement('div');
  h.className = 'hint'; h.id = 'hint';
  h.innerHTML = `<h4>${logo(16)}Это кликабельный макет</h4><ul>
    <li><b>Двойной клик</b> по сессии — подключиться</li>
    <li>Файлы: клик раскрывает папку, <b>двойной клик</b> открывает файл в редакторе</li>
    <li><b>Правый клик</b> по файлу, сессии или макросу — меню</li>
    <li>В терминале можно печатать: <span class="mono">ls, cd, cat, nano, df -h, help</span></li>
    <li>Вверху справа — <b>стиль и раскладка</b></li></ul>
    <p class="hint-note">Серверы и данные вымышленные.</p>
    <button class="btn sm primary" data-act="hint-close">Понятно</button>`;
  document.body.appendChild(h);
}
function init() {
  const hp = new URLSearchParams(location.hash.slice(1));
  const th = hp.get('theme');
  if (DEFAULT_LAYOUT[th]) { state.theme = th; state.layout = DEFAULT_LAYOUT[th]; }
  const ly = hp.get('layout');
  if (['stacked', 'classic', 'ide'].includes(ly)) state.layout = ly;
  const view = (hp.get('view') || '').split(',');
  if (view.includes('files')) state.side = 'files';
  buildChrome();
  applyMock();
  bindEvents();
  openSession('s-alpha', { silent: true });
  scripted('s-alpha', 'docker ps');
  openSession('s-web01', { silent: true, activate: false });
  scripted('s-web01', 'ls -la');
  state.files['s-alpha'].expanded.add('/root/app');
  openFile('s-alpha', '/root/deploy.sh', { silent: true, activate: false });
  state.files['s-alpha'].sel = '/root/deploy.sh';
  state.selectedSession = 's-alpha';
  state.activeTab = termTabOf('s-alpha').id;
  renderAll();
  setFocus('pane');
  if (!view.includes('nohint')) showHint();
  if (view.includes('file')) activate(state.tabs.find(x => x.kind === 'file').id);
  if (view.includes('session')) openSessionModal();
  if (view.includes('macro')) openMacroModal('m1');
  if (view.includes('menu')) {
    setTimeout(() => {
      const r = $('.row[data-path="/root/deploy.sh"]');
      if (r) { const b = r.getBoundingClientRect(); fileMenu(b.left + 70, b.top + b.height / 2, '/root/deploy.sh'); }
    }, 400);
  }
}
init();
})();
